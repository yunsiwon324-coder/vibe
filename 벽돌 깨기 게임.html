<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>벽돌 깨기</title>
<style>
:root{--bg:#e9eef5;--ink:#14213d;--panel:#fff;--muted:#5b6b85;--ball:#14213d;--r0:#3a6ea5;--r1:#2a9d8f;--r2:#d4a72c;--r3:#f08a4b;--r4:#d64550;--r5:#8a4fb0;--rb:#fff7c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1722;--ink:#e8eef7;--panel:#18222f;--muted:#8fa0b8;--ball:#f5f7fb;--r0:#5b9bd5;--r1:#3cc4b3;--r2:#e8c04a;--r3:#f59e63;--r4:#ef6b75;--r5:#b57fdb;--rb:#fff7c2}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1722;--ink:#e8eef7;--panel:#18222f;--muted:#8fa0b8;--ball:#f5f7fb;--r0:#5b9bd5;--r1:#3cc4b3;--r2:#e8c04a;--r3:#f59e63;--r4:#ef6b75;--r5:#b57fdb;--rb:#fff7c2}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.hud{width:min(94vw,480px);display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font-weight:700;font-size:14px}
.hud span{color:var(--muted);font-weight:500;margin-right:4px}
canvas{background:var(--rb);border-radius:10px;touch-action:none;max-width:94vw;max-height:calc(100% - 150px);aspect-ratio:3/4;height:auto;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.hint{font-size:13px;color:var(--muted);text-align:center}
.test{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.test input{width:70px;padding:4px 6px;border:1px solid var(--muted);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.test button{padding:4px 10px;border:1px solid var(--muted);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
</style>
</head>

const PINK=['#ff5fa2','#ff7db3','#ff9cc4','#ff6fa8','#ff8fbd','#f2459a'];
let st='ready',score=0,lives=3,level=1,bricks=[],balls=[],keys={},sp=5,best=0,newBest=false;
try{best=+localStorage.getItem('brick-best')||0}catch(e){}
let realTemp=null,testTemp=null;
const temp=()=>testTemp!==null?testTemp:realTemp;
const mult=()=>{const t=temp();return t===null?1:t>=25?1.3:t<10?.75:1;};
const spd=()=>Math.min(12,(5+(level-1)*1.3)*mult());
function tempMsg(){const t=temp();if(t===null)return '기온을 못 가져왔어요, 기본 속도예요';return '오늘 서울 '+t.toFixed(1)+'°C: '+(t>=25?'더워서 공이 빨라요!':t<10?'추워서 공이 느려요':'선선해서 기본 속도예요');}
function tempChanged(){const old=sp;sp=spd();if(old>0)for(const B of balls){B.dx*=sp/old;B.dy*=sp/old;}const t=temp();document.getElementById('wx').textContent=t===null?'--°C':t.toFixed(1)+'°C'+(testTemp!==null?'(테스트)':'');}
const P={w:90,h:12,x:W/2-45,y:H-40};
function build(){
 bricks=[];const ph=Math.min(.35,.15+level*.03);
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const h=Math.random()<ph;bricks.push({x:OX+c*(BW+GAP),y:OY+r*(BH+GAP),r,on:true,hard:h,hp:h?2:1,item:false});}
 bricks.filter(b=>!b.hard).sort(()=>Math.random()-.5).slice(0,4).forEach(b=>b.item=true);
}
function resetBall(){balls=[{x:P.x+P.w/2,y:P.y-R-1,dx:0,dy:0}];}
function launch(){const a=(Math.random()*60-30)*Math.PI/180;sp=spd();balls[0].dx=sp*Math.sin(a);balls[0].dy=-sp*Math.cos(a);}
function split(){
 if(balls.length>=4)return;
 const o=balls[Math.floor(Math.random()*balls.length)],t=(Math.random()<.5?-1:1)*.6,c=Math.cos(t),n=Math.sin(t);
 balls.push({x:o.x,y:o.y,dx:o.dx*c-o.dy*n,dy:o.dx*n+o.dy*c});
}
function hud(){
 s.textContent=score;l.textContent=level;v.textContent=lives;
 if(score>best){if(best>0)newBest=true;best=score;try{localStorage.setItem('brick-best',best)}catch(e){}}
 bs.textContent=best;
}
function newGame(){score=0;lives=3;level=1;P.w=90;newBest=false;build();resetBall();hud();st='ready';}
function action(){if(st==='ready'){launch();st='play';}else if(st==='play')st='pause';else if(st==='pause')st='play';else newGame();}
function moveTo(cx){const r=cv.getBoundingClientRect();P.x=Math.max(0,Math.min(W-P.w,(cx-r.left)/r.width*W-P.w/2));}
cv.addEventListener('pointermove',e=>moveTo(e.clientX));
cv.addEventListener('pointerdown',e=>{moveTo(e.clientX);action();});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key===' '){e.preventDefault();action();}keys[e.key]=1;});
addEventListener('keyup',e=>keys[e.key]=0);
function step(){
 if(keys.ArrowLeft)P.x=Math.max(0,P.x-8);
 if(keys.ArrowRight)P.x=Math.min(W-P.w,P.x+8);
 if(st==='ready'){balls[0].x=P.x+P.w/2;return;}
 if(st!=='play')return;
 for(const B of [...balls]){
  B.x+=B.dx;B.y+=B.dy;
  if(B.x<R){B.x=R;B.dx*=-1;}
  if(B.x>W-R){B.x=W-R;B.dx*=-1;}
  if(B.y<R){B.y=R;B.dy*=-1;}
  if(B.dy>0&&B.y+R>=P.y&&B.y+R<=P.y+P.h+8&&B.x>=P.x-R&&B.x<=P.x+P.w+R){
   const t=(B.x-(P.x+P.w/2))/(P.w/2),a=t*60*Math.PI/180;
   B.dx=sp*Math.sin(a);B.dy=-sp*Math.cos(a);B.y=P.y-R;
  }
  for(const b of bricks){
   if(!b.on)continue;
   if(B.x+R>b.x&&B.x-R<b.x+BW&&B.y+R>b.y&&B.y-R<b.y+BH){
    b.hp--;
    if(b.hp<=0){b.on=false;score+=b.hard?30:10*(ROWS-b.r);if(b.item)split();}else score+=5;
    const ox=Math.min(B.x+R-b.x,b.x+BW-(B.x-R)),oy=Math.min(B.y+R-b.y,b.y+BH-(B.y-R));
    if(ox<oy)B.dx*=-1;else B.dy*=-1;
    hud();break;
   }
  }
 }
 if(!bricks.some(b=>b.on)){level++;P.w=Math.max(60,P.w-8);build();resetBall();st='ready';hud();return;}
 balls=balls.filter(B=>B.y<=H+R);
 if(!balls.length){lives--;hud();if(lives<=0)st='over';else{resetBall();st='ready';}}
}
function star(cx,cy,r){
 g.beginPath();
 for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}
 g.closePath();g.fillStyle='#ffd23f';g.fill();g.strokeStyle='#b8860b';g.lineWidth=1.3;g.stroke();
}
function heart(b){
 const sx=BW/1.6,sy=BH/1.56;
 g.save();g.translate(b.x+BW/2,b.y+BH/2-.04*sy);g.scale(sx,sy);
 g.fillStyle=b.hard&&b.hp>1?'#8e44ad':PINK[b.r];
 g.beginPath();g.moveTo(0,.825);g.bezierCurveTo(-1.5,-.175,-.7,-1.275,0,-.475);g.bezierCurveTo(.7,-1.275,1.5,-.175,0,.825);g.fill();
 g.strokeStyle=b.hard?'#4a1b5a':'#c93a7c';g.lineWidth=(b.hard?2.4:1.6)/sx;g.stroke();
 if(b.hard&&b.hp===1){g.beginPath();g.moveTo(-.1,-.6);g.lineTo(.1,-.2);g.lineTo(-.15,.1);g.lineTo(.05,.45);g.lineWidth=1.8/sx;g.stroke();}
 g.restore();
 if(b.item)star(b.x+BW/2,b.y+BH/2-2,9);
}
function text(t,y,size,c){g.font='700 '+size+'px "Noto Sans KR",system-ui,sans-serif';g.textAlign='center';const w=g.measureText(t).width+24;g.globalAlpha=.88;g.fillStyle=css('--panel');g.beginPath();g.roundRect(W/2-w/2,y-size,w,size+10,8);g.fill();g.globalAlpha=1;g.fillStyle=c;g.fillText(t,W/2,y);}
function draw(){
 g.clearRect(0,0,W,H);
 for(const b of bricks)if(b.on)heart(b);
 g.fillStyle=css('--ink');g.beginPath();g.roundRect(P.x,P.y,P.w,P.h,6);g.fill();
 for(const B of balls)g.drawImage(IMG,B.x-20,B.y-20,40,40);
 const ink=css('--ink'),mu=css('--muted');
 if(st==='ready'){text(level===1&&score===0?'벽돌 깨기':'레벨 '+level,H/2+20,32,ink);text(level>1?'공이 더 빨라졌어요! 탭해서 발사':'탭하거나 스페이스를 눌러 공 발사',H/2+52,15,mu);text(tempMsg(),H/2+84,15,ink);}
 if(st==='pause'){text('일시정지',H/2+20,32,ink);text('탭하거나 스페이스로 계속',H/2+52,15,mu);}
 if(st==='over'){text('게임 오버',H/2-10,32,ink);text('점수 '+score,H/2+22,18,ink);text('최고 기록 '+best+(newBest?' (신기록!)':''),H/2+52,18,ink);text('탭하거나 스페이스로 다시 시작',H/2+82,15,mu);}
}
function loop(){step();draw();requestAnimationFrame(loop);}
const ti=document.getElementById('ti');
function applyTest(){const v=parseFloat(ti.value);testTemp=isNaN(v)?null:v;tempChanged();}
ti.addEventListener('input',applyTest);
document.getElementById('tc').addEventListener('click',()=>{ti.value='';applyTest();});
(async()=>{try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current=temperature_2m&timezone=Asia%2FSeoul');const d=await r.json(),t=d.current.temperature_2m;if(typeof t==='number')realTemp=t;tempChanged();}catch(e){}})();
newGame();loop();
</script>
